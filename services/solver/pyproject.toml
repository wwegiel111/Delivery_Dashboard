[project]
name = "etpromo-solver"
version = "0.1.0"
description = "ETPromo — tygodniowy solver harmonogramu magazynu (FastAPI + OR-Tools CP-SAT)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "ortools==9.12.4544",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
